# Builds the Finalist Node as one executable per platform (PyInstaller, unsigned), checks that each
# one starts and answers, and on a version tag publishes them as a release.
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   name: finalist-node-linux-x64.AppImage }
          - { os: macos-15,       name: finalist-node-macos-arm64.zip }
          - { os: macos-15-intel, name: finalist-node-macos-intel.zip }
          - { os: windows-2022,   name: finalist-node-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: node
        run: |
          # the voice (voice/voiced.py, run by the executable with --voice) needs these three
          pip install pyinstaller==6.* numpy websockets onnxruntime || pip install pyinstaller==6.* numpy websockets "onnxruntime<1.20"
          sep=$(python -c "import os; print(os.pathsep)")   # ; on Windows, : elsewhere
          common=(--collect-submodules websockets --add-data "data${sep}data" --add-data "voice${sep}voice")
          if [ "$RUNNER_OS" = macOS ]; then
            # a Mac's own portable form: an .app, no Terminal window
            pyinstaller --windowed --onedir --name "Finalist Node" --osx-bundle-identifier sh.raahat.finalist-node "${common[@]}" finalist-node.py
            echo "EXE=dist/Finalist Node.app/Contents/MacOS/Finalist Node" >> "$GITHUB_ENV"
          else
            pyinstaller --onefile --console --name finalist-node "${common[@]}" finalist-node.py
            [ -f dist/finalist-node.exe ] && echo "EXE=dist/finalist-node.exe" >> "$GITHUB_ENV" || echo "EXE=dist/finalist-node" >> "$GITHUB_ENV"
          fi
          ls -l dist
      - name: Package
        run: |
          # Portable, nothing installed (Raahat): an AppImage on Linux, an .app on a Mac, the .exe on Windows
          mkdir out
          case "${{ matrix.name }}" in
            *.exe) cp node/dist/finalist-node.exe "out/${{ matrix.name }}" ;;
            *.zip) ditto -c -k --keepParent "node/dist/Finalist Node.app" "out/${{ matrix.name }}" ;;
            *.AppImage)
              A=AppDir; mkdir -p $A/usr/bin
              cp node/dist/finalist-node $A/usr/bin/finalist-node
              printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/finalist-node" "$@"\n' > $A/AppRun
              chmod +x $A/AppRun $A/usr/bin/finalist-node
              printf '[Desktop Entry]\nType=Application\nName=Finalist Node\nComment=Patient and Examiner Claude for Finalist, on this computer\nExec=finalist-node\nIcon=finalist-node\nTerminal=false\nCategories=Education;\n' > $A/finalist-node.desktop
              cp assets/finalist-node.png $A/finalist-node.png && cp assets/finalist-node.png $A/.DirIcon   # appimagetool wants a PNG
              curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $A "out/${{ matrix.name }}"
              echo "PKG=out/${{ matrix.name }}" >> "$GITHUB_ENV" ;;
          esac
          ls -l out
      - name: Starts and answers
        run: |
          # the packaged thing itself where it differs (the AppImage); the .app's own executable; the .exe
          exe="node/$EXE"
          [ -n "${PKG:-}" ] && exe="$PKG" && export APPIMAGE_EXTRACT_AND_RUN=1
          cfg="$RUNNER_TEMP/node.json"; data="$RUNNER_TEMP/node-data"
          python -c "import json,sys; json.dump({'port': 47699, 'data': sys.argv[2], 'open_window': False}, open(sys.argv[1], 'w'))" "$cfg" "$data"
          FINALIST_NODE_CONFIG="$cfg" "$exe" --no-window > "$RUNNER_TEMP/node.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:47699/v1/hello -o /dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/node.log"
          # to files first: grep -q stops reading early and curl then fails with 23 (31 Oct, on the Macs)
          curl -sf http://127.0.0.1:47699/v1/hello -o hello.json && grep -q '"node"' hello.json
          curl -sf http://127.0.0.1:47699/ -o screen.html && grep -q "Finalist Node" screen.html
          # the voice's own Python parts are inside (its engine and models download on the machine)
          "$exe" --voice --help > voice-help.txt && grep -q -- "--engine" voice-help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
  release:
    # whatever built: one platform failing shouldn't hold back the others
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            Download the one for your computer, then start it: it opens its own screen in your browser.
            See the README for the one-time "unidentified developer" step on macOS and Windows.
