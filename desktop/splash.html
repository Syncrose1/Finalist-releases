<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Finalist</title>
<style>
  :root { --paper: #f2ecdd; --ink: #1c1812; --ink3: #8a8171; }
  @media (prefers-color-scheme: dark) { :root { --paper: #15130f; --ink: #f2ecdd; --ink3: #978d7c; } }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Hanken Grotesk", system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  .m { width: 56px; height: 56px; border-radius: 14px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 600 28px/1 Georgia, serif; margin: 0 auto 16px; animation: b 1.6s ease-in-out infinite; }
  @keyframes b { 50% { transform: scale(.94); opacity: .8; } }
  p { margin: 0; text-align: center; font-size: 14px; color: var(--ink3); }
</style></head>
<body><div><div class="m">F</div><p>Starting your Finalist Node…</p></div></body></html>
