<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finalist timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Finalist's floating timer (4 Nov 2026): Almanac's bone card, ink type and surgical green; the
     night palette when the system is dark. Drag it anywhere; pause keeps it, stop takes it away. */
  :root {
    --paper: #f2ecdd; --card: #fbf7ee; --ink: #1c1812; --ink-2: #5e5649; --ink-3: #8a8171; --line: #e3dccd; --line-2: #d6cdb9;
    --go: #0f7355; --amber: #b5791f; --blk: var(--go);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15130f; --card: #1e1b16; --ink: #f2ecdd; --ink-2: #c7bda9; --ink-3: #978d7c; --line: #332e26; --line-2: #423b30; --go: #3bb38a; --amber: #e0a23e; }
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
  .card { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 11px; padding: 0 10px 0 12px;
    border-radius: 16px; background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; cursor: grab;
    animation: pop .45s cubic-bezier(.2,1.35,.4,1) both; }
  .card:active { cursor: grabbing; }
  .card { cursor: default; padding-left: 6px; }
  .grip { flex: none; align-self: stretch; width: 12px; margin: 10px 0; border-radius: 6px; -webkit-app-region: drag; cursor: grab;
    background: radial-gradient(circle, var(--ink-3) 1.1px, transparent 1.4px) 0 0 / 6px 6px; opacity: .55; }
  .grip:hover { opacity: .9; }
  .open { all: unset; flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; cursor: pointer; border-radius: 12px; padding: 4px; }
  .open:hover .mark { transform: translateY(-1px); } .mark { transition: transform .3s cubic-bezier(.2,1.35,.4,1); }
  .open:focus-visible { outline: 2px solid var(--go); }
  .ask { position: absolute; inset: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--card);
    font: 600 13px/1.2 "Hanken Grotesk", sans-serif; animation: pop .3s cubic-bezier(.2,1.35,.4,1) both; }
  .ask[hidden] { display: none; }
  .ask span { flex: 1; }
  .ask button { width: auto; padding: 0 12px; }
  .card.bye { animation: out .22s ease forwards; }
  @keyframes out { to { opacity: 0; transform: scale(.96); } }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.94); } }
  .mark { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--paper); display: grid; place-items: center;
    font: 600 18px/1 "Fraunces", Georgia, serif; position: relative; }
  .mark::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--blk);
    border: 2px solid var(--card); animation: beat 1.8s ease-in-out infinite; }
  .paused .mark::after { animation: none; background: var(--amber); }
  @keyframes beat { 50% { transform: scale(.7); opacity: .6; } }
  .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
  .eyebrow { font: 500 10px/1.2 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .time { font: 600 22px/1 "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .of { font: 500 11.5px/1 "JetBrains Mono", monospace; color: var(--ink-3); }
  .state { font: 600 10px/1 "Hanken Grotesk", sans-serif; letter-spacing: .04em; color: var(--amber); padding: 3px 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--amber) 14%, transparent); display: none; }
  .paused .state { display: inline-block; }
  .paused .time { color: var(--ink-2); }
  button { flex: none; width: 34px; height: 34px; border-radius: 11px; border: 1px solid var(--line-2); background: transparent; color: var(--ink);
    display: grid; place-items: center; cursor: pointer; transition: transform .3s cubic-bezier(.2,1.35,.4,1), border-color .2s, background .2s; }
  button:hover { transform: translateY(-1px); border-color: var(--ink-3); }
  button:active { transform: scale(.92); }
  .pp { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pp:hover { background: var(--go); border-color: var(--go); }
  .stop:hover { border-color: #c0503f; color: #c0503f; }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--blk); border-radius: 0 2px 0 0; transition: width .9s linear; }
  .paused .bar { background: var(--amber); }
  @media (prefers-reduced-motion: reduce) { .card, .mark::after { animation: none; } }
</style>
</head>
<body>
<div class="card" id="card">
  <span class="grip" title="Drag to move" aria-hidden="true"></span>
  <button class="open" id="open" title="Back to its page"><span class="mark">F</span>
  <div class="txt">
    <span class="eyebrow" id="what">…</span>
    <span class="row"><span class="time" id="time">0:00</span><span class="of" id="of"></span><span class="state">Paused</span></span>
  </div></button>
  <button id="pp" class="pp" aria-label="Pause" title="Pause"></button>
  <button id="stop" class="stop" aria-label="Stop" title="Stop timing this"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="2" fill="currentColor"/></svg></button>
  <span class="bar" id="bar"></span>
  <div class="ask" id="ask" hidden><span></span><button id="yes" class="pp">Yes</button><button id="no">No</button></div>
</div>
<script>
  // what each block is, in Finalist's words; AKT work green, CPSA amber, as on Revise
  const NAME = { qqm: 'Reading', passmed: 'PassMedicine', anki: 'Anki', workout: 'Workout', osce: 'Stations', akt: 'AKT', psa: 'PSA', fy1: 'FY1' }
  const KIND = { osce: 'var(--amber)' }
  const block = new URLSearchParams(location.search).get('b')
  if (KIND[block]) document.documentElement.style.setProperty('--blk', KIND[block])
    const PAUSE = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" rx="1" fill="currentColor"/><rect x="7" y="1" width="3" height="10" rx="1" fill="currentColor"/></svg>'
  const PLAY = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>'
  let t = null, subject = '', at = Date.now()
  const fmt = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}` }
  function draw() {
    if (!t) return
    const ms = t.ms + (t.running ? Date.now() - at : 0)
    document.getElementById('what').textContent = [NAME[block] || t.name, block === 'workout' ? '' : subject].filter(Boolean).join(' · ')
    document.getElementById('time').textContent = fmt(ms)
    document.getElementById('of').textContent = t.plan_min ? `/ ${t.plan_min}m` : ''
    document.getElementById('bar').style.width = t.plan_min ? `${Math.min(100, (100 * ms) / (t.plan_min * 60000))}%` : '0'
    document.getElementById('card').classList.toggle('paused', !t.running)
    const pp = document.getElementById('pp')
    pp.innerHTML = t.running ? PAUSE : PLAY
    pp.setAttribute('aria-label', t.running ? 'Pause' : 'Resume')
    pp.title = t.running ? 'Pause' : 'Resume'
  }
  async function refresh() {
    try { const r = await window.finalist.state(block); if (r.timer) { t = r.timer; at = Date.now() } if (r.subject) subject = r.subject } catch (e) {}
    draw()
  }
  async function act(op, replace) {
    try {
      const r = await window.finalist.act(block, op, replace)
      if (r.conflict) return ask(r.conflict)
      if (r.timer) { t = r.timer; at = Date.now() }
    } catch (e) {}
    draw()
  }
  // another timer running: ask here, in the timer (one at a time; no keeps the running one)
  function ask(c) {
    const NAMES = { qqm: 'Reading', passmed: 'PassMedicine', anki: 'Anki', workout: 'Workout', osce: 'Stations', akt: 'AKT', psa: 'PSA', fy1: 'FY1' }
    const q = document.getElementById('ask')
    q.querySelector('span').textContent = `Stop ${NAMES[c.block] || c.name} for this?`
    q.hidden = false
  }
  document.getElementById('yes').addEventListener('click', () => { document.getElementById('ask').hidden = true; act('start', true) })
  document.getElementById('no').addEventListener('click', () => { document.getElementById('ask').hidden = true })
  // click the timer (not its buttons): back to the page it was started from
  document.getElementById('open').addEventListener('click', () => window.finalist.open(block))
  window.finalist.onBye(() => document.getElementById('card').classList.add('bye'))
  document.getElementById('pp').addEventListener('click', () => act(t && t.running ? 'pause' : 'start'))
  document.getElementById('stop').addEventListener('click', () => act('stop'))
  for (const id of ['pp', 'stop']) document.getElementById(id).addEventListener('mousedown', (e) => e.stopPropagation())
  refresh(); setInterval(refresh, 1000); setInterval(draw, 250)
</script>
</body>
</html>
